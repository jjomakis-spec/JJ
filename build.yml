name: Build JJ Player APK

on:
  workflow_dispatch:
  push:
    paths:
      - "main.py"
      - "buildozer.spec"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev build-essential ccache libltdl-dev
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Set Android minimum API
        shell: bash
        run: |
          if grep -q '^android.minapi' buildozer.spec; then
            sed -i 's/^android.minapi.*/android.minapi = 24/' buildozer.spec
          else
            sed -i '/^\[app\]/a android.minapi = 24' buildozer.spec
          fi
          grep '^android.minapi' buildozer.spec

      - name: Build APK and apply CPython fix if needed
        shell: bash
        run: |
          set +e
          buildozer -v android debug 2>&1 | tee build-first.log
          first_status=${PIPESTATUS[0]}

          if [ "$first_status" -eq 0 ]; then
            exit 0
          fi

          if ! grep -Eq 'preadv|pwritev' build-first.log; then
            echo "Build failed for a different reason; see build-first.log"
            exit "$first_status"
          fi

          echo "Applying Android CPython header fix..."

          mapfile -t files < <(
            find .buildozer -type f \
              -path '*/python3/Python/remote_debugging.c'
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "Could not locate CPython remote_debugging.c"
            exit "$first_status"
          fi

          for file in "${files[@]}"; do
            if ! grep -q '#include <sys/uio.h>' "$file"; then
              sed -i '1i#include <sys/uio.h>' "$file"
            fi
          done

          buildozer -v android debug 2>&1 | tee build-retry.log
          retry_status=${PIPESTATUS[0]}
          exit "$retry_status"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JJ-Player-build-logs
          path: |
            build-first.log
            build-retry.log
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JJ-Player-APK
          path: bin/*.apk
          if-no-files-found: error
